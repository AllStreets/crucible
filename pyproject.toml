[project]
name = "crucible"
version = "0.1.0"
description = "Executed multi-agent safety research"
requires-python = ">=3.11"
# reportlab typesets the papers. It is a hard dependency rather than an extra
# because publishing writes a PDF beside every paper and a build without it
# produced markdown only, silently: the one machine that had it installed by
# hand kept working while a fresh checkout could not make a paper at all.
dependencies = ["pyyaml>=6.0", "reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
crucible = "crucible.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crucible"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
